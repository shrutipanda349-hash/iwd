<!--14.	Write a program to print the following pattern in JavaScript?

 s
s i 
s i l
s i l i
s i l i c
s i l i c o
s i l i c o n
--!>
<html >
<head>
    <meta charset="UTF-8">
    <title>JavaScript Pattern</title>
</head>
<body>

    <pre id="pattern-output"></pre>

    <script>
        const word = "silicon";
        let output = "";

       
        for (let i = 1; i <= word.length; i++) {
           
            let subWord = word.substring(0, i);
            
            
            let rowStr = subWord.split("").join(" ");
            
            
            output += rowStr + "\n";
        }

       
        document.getElementById("pattern-output").textContent = output;
    </script>

</body>
</html><!--
