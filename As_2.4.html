<!DOCTYPE html>
<html>
<head>
    <title>Object-Oriented Programming: Inheritance</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 50px;
            background-image: url('img.jpg');
            background-size: cover;
            background-position: center;
        }
        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        input {
            padding: 10px;
            margin: 8px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
            text-align: left;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pet Simulator (Inheritance)</h2>
        <input type="text" id="petName" placeholder="Enter Dog Name" value="Buddy">
        <input type="text" id="petBreed" placeholder="Enter Breed" value="Golden Retriever">
        <br>
        <button onclick="triggerEat()">Make it Eat</button>
        <button onclick="triggerBark()">Make it Bark</button>
        
        <p id="result">Interact with your dog to see inheritance in action!</p>
    </div>

    <script>
        // Parent class
        class Animal {
            constructor(name) {
                this.name = name;
            }
            eat() {
                return `${this.name} is eating. (Inherited from Animal class)`;
            }
        }

        // Child class inherits from Animal
        class Dog extends Animal {
            constructor(name, breed) {
                super(name); // Calls the parent constructor
                this.breed = breed;
            }
            bark() {
                return `${this.name} the ${this.breed} barks! (Custom Dog method)`;
            }
        }

        // UI Interaction Logic
        function getDogInstance() {
            let name = document.getElementById("petName").value || "Unnamed Dog";
            let breed = document.getElementById("petBreed").value || "Unknown Breed";
            return new Dog(name, breed);
        }

        function triggerEat() {
            const myDog = getDogInstance();
            document.getElementById("result").innerHTML = myDog.eat();
        }

        function triggerBark() {
            const myDog = getDogInstance();
            document.getElementById("result").innerHTML = myDog.bark();
        }
    </script>

</body>
</html>
