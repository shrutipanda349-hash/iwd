<!--26.	What is the DOM, and why is it important for interactive web pages, create a calculator program using DOM --!>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple DOM Calculator</title>
</head>
<body>

    <!-- Calculator Display Screen -->
    <input type="text" id="display" readonly>
    <br><br>

    <!-- Calculator Buttons -->
    <div>
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="appendToDisplay('+')">+</button>
        <br>
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button onclick="appendToDisplay('-')">-</button>
        <br>
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button onclick="appendToDisplay('*')">*</button>
        <br>
        <button onclick="clearDisplay()">C</button>
        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="calculateResult()">=</button>
        <button onclick="appendToDisplay('/')">/</button>
    </div>

    <!-- JavaScript DOM Logic -->
    <script>
        // DOM Selection: target the input element by its ID
        const display = document.getElementById('display');

        // DOM Manipulation: update the input value on button click
        function appendToDisplay(value) {
            display.value += value;
        }

        // DOM Manipulation: clear the screen
        function clearDisplay() {
            display.value = '';
        }

        // DOM Logic: evaluate the math expression and update the screen
        function calculateResult() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>

</body>
</html>
