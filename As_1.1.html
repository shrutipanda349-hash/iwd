<html>
<head>
      <title>AREA OF CIRCLE</title>
	  
</head>
<body bgcolor="white">

<input type="text" id="r"  placeholder="enter the radious"><br>
<input type="submit" onclick="calculateradius()">

<script>
function calculateradius(){

	  var r=document.getElementById("r").value;
	  console.log(r);
	  a=3.14*r*r;
	  console.log(a);
	  //document.write("area of circle is="+a+"<br>");
	  }
	</script>
     
</body>
</html>
